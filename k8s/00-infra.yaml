apiVersion: v1
kind: Namespace
metadata:
  name: mama
---
apiVersion: v1
kind: Secret
metadata:
  name: mama-secrets
  namespace: mama
type: Opaque
stringData:
  POSTGRES_PASSWORD: changeme_in_prod
  DATABASE_URL: postgresql://mama:changeme_in_prod@postgres:5432/mama
  JWT_SECRET: replace_with_long_random_secret
  REDIS_URL: redis://redis:6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: mama
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: mama
            - name: POSTGRES_DB
              value: mama
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: mama-secrets, key: POSTGRES_PASSWORD }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "mama"] }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mama
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: mama
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: mama
spec:
  selector: { app: redis }
  ports:
    - port: 6379
      targetPort: 6379
