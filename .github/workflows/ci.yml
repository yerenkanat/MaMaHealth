name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Отменяем устаревшие прогоны при новом пуше в ту же ветку.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Flutter клиент ─────────────────────────────────────────────
  flutter:
    name: Flutter · analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # ── Node API ───────────────────────────────────────────────────
  api:
    name: API · typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: api/package.json
      - run: npm install
      - run: npm run build

  # ── Node Worker ────────────────────────────────────────────────
  worker:
    name: Worker · typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: worker/package.json
      - run: npm install
      - run: npm run build
